<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F3A27"/>
      <stop offset="50%" stop-color="#2F523A"/>
      <stop offset="100%" stop-color="#14261A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- App Icon Base with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer Globe Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#34D399" stroke-opacity="0.25" stroke-width="4"/>
  
  <!-- Inner Globe Structure -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#E2E8F0" stroke-opacity="0.3" stroke-width="6"/>
  <ellipse cx="256" cy="256" rx="80" ry="140" fill="none" stroke="#E2E8F0" stroke-opacity="0.25" stroke-width="5"/>
  <line x1="116" y1="256" x2="396" y2="256" stroke="#E2E8F0" stroke-opacity="0.25" stroke-width="5"/>
  
  <!-- Center Speech Bubble Emblem with Glow -->
  <g filter="url(#glow)">
    <path d="M 200 170 C 150 170 110 206 110 250 C 110 274 123 296 145 310 L 135 345 C 134 348 137 352 141 350 L 180 332 C 187 334 193 335 200 335 C 250 335 290 299 290 255 C 290 211 250 170 200 170 Z" fill="url(#accent)"/>
    
    <!-- Audio Wave lines inside bubble -->
    <line x1="165" y1="252" x2="165" y2="258" stroke="#14261A" stroke-width="4" stroke-linecap="round"/>
    <line x1="182" y1="244" x2="182" y2="266" stroke="#14261A" stroke-width="4" stroke-linecap="round"/>
    <line x1="200" y1="236" x2="200" y2="274" stroke="#14261A" stroke-width="5" stroke-linecap="round"/>
    <line x1="218" y1="242" x2="218" y2="268" stroke="#14261A" stroke-width="4" stroke-linecap="round"/>
    <line x1="235" y1="250" x2="235" y2="260" stroke="#14261A" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Secondary Responsive Speech Bubble -->
  <path d="M 330 220 C 370 220 400 248 400 282 C 400 300 390 316 374 326 L 382 352 C 383 355 380 357 377 355 L 347 342 C 341 343 336 344 330 344 C 290 344 260 316 260 282 C 260 248 290 220 330 220 Z" fill="#F6F7F2" fill-opacity="0.95"/>
  <circle cx="305" cy="282" r="5" fill="#2F523A"/>
  <circle cx="330" cy="282" r="5" fill="#2F523A"/>
  <circle cx="355" cy="282" r="5" fill="#2F523A"/>
</svg>
